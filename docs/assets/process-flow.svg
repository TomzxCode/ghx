<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="520" viewBox="0 0 1040 520" role="img" aria-labelledby="pf-title pf-desc">
  <title id="pf-title">The production line: issues and pull requests as stations</title>
  <desc id="pf-desc">Two production lines. An open issue moves to Closed when it closes. A pull request starts in Draft, moves to Waiting on reviewer when it is ready for review, moves to Waiting on author on a changes-requested review or to Waiting on merge on an approval, and reaches Merged when merged. Closing an open pull request without merging moves it to Discarded.</desc>

  <style>
    /* Light mode lives in presentation attributes, so a renderer that drops
       CSS still gets a complete diagram. Dark mode overrides the tokens. */
    @media (prefers-color-scheme: dark) {
      .pf-bg { fill: #0b1220; }
      .pf-surface { fill: #111c2e; stroke: #334155; }
      .pf-done { fill: #0f2a1d; stroke: #1e5b38; }
      .pf-scrap { fill: #111c2e; stroke: #334155; }
      .pf-title, .pf-name { fill: #e2e8f0; }
      .pf-muted, .pf-role, .pf-label { fill: #94a3b8; }
      .pf-edge { stroke: #64748b; }
      .pf-head { fill: #64748b; }
    }
  </style>

  <defs>
    <marker id="pf-arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path class="pf-head" d="M 0 0 L 8 4 L 0 8 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect class="pf-bg" x="0" y="0" width="1040" height="520" fill="#ffffff"/>

  <!-- Header -->
  <text class="pf-title" x="520" y="48" fill="#0f172a" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" text-anchor="middle">The production line</text>
  <text class="pf-muted" x="520" y="72" fill="#64748b" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">Issues and pull requests as two lines: work sits in stations, and arrows are the moves between them.</text>

  <!-- Lane headers -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#64748b">
    <text class="pf-muted" x="40" y="112" letter-spacing="1.2">ISSUES</text>
    <text class="pf-muted" x="40" y="232" letter-spacing="1.2">PULL REQUESTS</text>
  </g>
  <g class="pf-muted" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#64748b" text-anchor="end">
    <text x="1000" y="112">cycle time: created &#8594; closed</text>
    <text x="1000" y="232">cycle time: created &#8594; merged</text>
  </g>

  <!-- Connectors -->
  <g class="pf-edges" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Issue: Open to Closed -->
    <path class="pf-edge" d="M 213 156 H 827" marker-end="url(#pf-arrow)"/>
    <!-- PR: Draft to Waiting on reviewer -->
    <path class="pf-edge" d="M 213 276 H 299" marker-end="url(#pf-arrow)"/>
    <!-- PR: Waiting on reviewer to Waiting on merge (approval) -->
    <path class="pf-edge" d="M 477 276 H 563" marker-end="url(#pf-arrow)"/>
    <!-- PR: Waiting on merge to Merged -->
    <path class="pf-edge" d="M 741 276 H 827" marker-end="url(#pf-arrow)"/>
    <!-- PR: Waiting on reviewer to Waiting on author (changes requested) -->
    <path class="pf-edge" d="M 388 309 V 367" marker-end="url(#pf-arrow)"/>
    <!-- PR: Waiting on author to Waiting on merge (approval) -->
    <path class="pf-edge" d="M 477 400 H 620 V 310" marker-end="url(#pf-arrow)"/>
    <!-- PR: Waiting on merge to Discarded (closed without merging) -->
    <path class="pf-edge" d="M 700 309 V 340 H 916 V 367" marker-end="url(#pf-arrow)"/>
  </g>

  <!-- Connector labels -->
  <g class="pf-label" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">
    <text x="520" y="148">closed</text>
    <text x="253" y="268">ready</text>
    <text x="517" y="268">approved</text>
    <text x="781" y="268">merged</text>
    <text x="548" y="392">approved</text>
    <text x="808" y="332">closed, unmerged</text>
    <text x="400" y="341" text-anchor="start">changes requested</text>
  </g>

  <!-- Issues line -->
  <g id="pf-station-open">
    <rect class="pf-surface" x="40" y="128" width="168" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="52" y="136" width="144" height="3" rx="1.5" fill="#64748b"/>
    <text class="pf-name" x="124" y="155" fill="#0f172a" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Open</text>
    <text class="pf-role" x="124" y="171" fill="#64748b" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle">unfinished work</text>
  </g>
  <g id="pf-station-closed">
    <rect class="pf-done" x="832" y="128" width="168" height="56" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <rect x="844" y="136" width="144" height="3" rx="1.5" fill="#16a34a"/>
    <text class="pf-name" x="916" y="155" fill="#0f172a" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Closed</text>
    <text class="pf-role" x="916" y="171" fill="#64748b" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle">completed</text>
  </g>

  <!-- Pull request line: draft and review-wait stations -->
  <g id="pf-station-draft">
    <rect class="pf-surface" x="40" y="248" width="168" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="52" y="256" width="144" height="3" rx="1.5" fill="#9333ea"/>
    <text class="pf-name" x="124" y="275" fill="#0f172a" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Draft</text>
    <text class="pf-role" x="124" y="291" fill="#64748b" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle">not ready for review</text>
  </g>
  <g id="pf-station-awaiting-review">
    <rect class="pf-surface" x="304" y="248" width="168" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="316" y="256" width="144" height="3" rx="1.5" fill="#2563eb"/>
    <text class="pf-name" x="388" y="275" fill="#0f172a" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Waiting on reviewer</text>
    <text class="pf-role" x="388" y="291" fill="#64748b" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle">review requested</text>
  </g>
  <g id="pf-station-awaiting-merge">
    <rect class="pf-surface" x="568" y="248" width="168" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="580" y="256" width="144" height="3" rx="1.5" fill="#0d9488"/>
    <text class="pf-name" x="652" y="275" fill="#0f172a" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Waiting on merge</text>
    <text class="pf-role" x="652" y="291" fill="#64748b" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle">approved</text>
  </g>
  <g id="pf-station-merged">
    <rect class="pf-done" x="832" y="248" width="168" height="56" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <rect x="844" y="256" width="144" height="3" rx="1.5" fill="#15803d"/>
    <text class="pf-name" x="916" y="275" fill="#0f172a" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Merged</text>
    <text class="pf-role" x="916" y="291" fill="#64748b" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle">completed</text>
  </g>

  <!-- Pull request line: revision and scrap stations -->
  <g id="pf-station-awaiting-author">
    <rect class="pf-surface" x="304" y="372" width="168" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="316" y="380" width="144" height="3" rx="1.5" fill="#d97706"/>
    <text class="pf-name" x="388" y="399" fill="#0f172a" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Waiting on author</text>
    <text class="pf-role" x="388" y="415" fill="#64748b" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle">changes requested</text>
  </g>
  <g id="pf-station-discarded">
    <rect class="pf-scrap" x="832" y="372" width="168" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 4"/>
    <rect x="844" y="380" width="144" height="3" rx="1.5" fill="#94a3b8"/>
    <text class="pf-name" x="916" y="399" fill="#0f172a" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Discarded</text>
    <text class="pf-role" x="916" y="415" fill="#64748b" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle">scrap, not completed</text>
  </g>

  <!-- Footnote -->
  <text class="pf-muted" x="520" y="482" fill="#64748b" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle">A pull request opened ready for review skips Draft; any open PR closed without merging is scrap.</text>
</svg>
